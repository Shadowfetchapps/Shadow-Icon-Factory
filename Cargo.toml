[package]
name = "shadow-icon-factory"
version = "1.0.0"
edition = "2021"
description = "Generate icon sets from a master image"
license = "MIT"
repository = "https://github.com/Shadowfetchapps/Shadow-Icon-Factory"
homepage = "https://github.com/Shadowfetchapps/Shadow-Icon-Factory"
authors = ["Shadow Icon Factory contributors"]
readme = "README.md"
default-run = "shadow-icon-factory"

[lib]
name = "shadow_icon_factory"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "shadow-icon-factory"
path = "src/main.rs"

[dependencies]
gtk = { version = "0.9", package = "gtk4", features = ["v4_14"] }
adw = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
glib = "0.20"
gio = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
thiserror = "2"
which = "7"
open = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
ico = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
